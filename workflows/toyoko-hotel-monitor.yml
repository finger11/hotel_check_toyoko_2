name: Toyoko Hotel Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run checker
        run: |
          python hotel_check_toyoko.py > result.json
          cat result.json

      - name: Create/close issues per hotel
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("result.json", "utf-8"));

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });

            let hasError = false;

            for (const h of data.hotels) {
              const title = `Toyoko 호텔 공실 발견 - ${h.name} (${h.code})`;
              const exist = openIssues.find(i => i.title === title);

              if (!h.ok) {
                hasError = true;
                core.warning(`${h.name} 확인 실패: ${h.note}`);
                continue;
              }

              if (h.found && !exist) {
                const body =
                  "Toyoko 예약 페이지에서 '객실 선택' 버튼이 감지되었다.\n\n" +
                  `- 호텔: ${h.name} (${h.code})\n` +
                  `- 확인시각: ${data.checked_at}\n` +
                  `- 매칭 개수: ${h.count}\n` +
                  `- 링크: ${h.url}\n`;
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body
                });
              } else if (!h.found && exist) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: exist.number,
                  state: "closed"
                });
              }
            }

            if (hasError) core.setFailed("일부 호텔 확인 중 오류가 발생했습니다.");
